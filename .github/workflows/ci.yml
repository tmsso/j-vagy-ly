# Runs the same checks as `npm run verify` on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
      # The build regenerates public/jly-pairs.json; a diff means the committed
      # file is stale (also asserted by the Python tests).
      - name: Generated data is committed
        run: git diff --exit-code -- public/jly-pairs.json
